name: Build

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "Dockerfile"
      - ".dockerignore"
      - "package.json"
  schedule:
    # Rebuild roughly every two weeks so bundled yt-dlp stays current.
    # GitHub cron has no true biweekly syntax; 1st and 15th is the closest.
    - cron: "0 4 1,15 * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: https://ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/pxr05/audiostream:latest
            ghcr.io/pxr05/audiostream:${{ github.sha }}
